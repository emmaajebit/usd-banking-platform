# nginx config for serving the SPA and proxying API calls to the gateway.
#
# NOTE: proxy_pass uses a variable + resolver so the gateway hostname is resolved
# at request time (not at startup). Without this, nginx exits on boot if the
# gateway isn't yet resolvable. 10.96.0.10 is the in-cluster CoreDNS address on
# kind; on EKS ingress fronts the SPA so this proxy is not the primary path.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 10.96.0.10 valid=10s ipv6=off;

    location /api/ {
        set $gw "api-gateway.banking.svc.cluster.local";
        proxy_pass http://$gw:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
