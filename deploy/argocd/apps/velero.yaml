# Velero server + node-agent (file-system backups via kopia). Uses IRSA (no static
# AWS keys) and the S3 bucket + role created by terraform/velero. Optional add-on.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: banking
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 12.1.0
    helm:
      values: |
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.14.2
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - mountPath: /target
                name: plugins
        # IRSA — assume the AWS role from terraform/velero; no static credentials.
        credentials:
          useSecret: false
        serviceAccount:
          server:
            name: velero # MUST be "velero" to match the IRSA trust (velero:velero)
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::118178010323:role/banking-dev-velero-irsa
        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: banking-velero-backups-118178010323
              config:
                region: us-east-1
          volumeSnapshotLocation:
            - name: default
              provider: aws
              config:
                region: us-east-1
        snapshotsEnabled: true
        deployNodeAgent: true # node-agent DaemonSet for file-system (kopia) backups
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
