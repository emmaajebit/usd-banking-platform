# Loki + Promtail: pod stdout -> Loki (logs, correlated to traces via trace_id).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: banking
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki-stack
      targetRevision: 2.10.3 # pinned; bump deliberately after testing
      helm:
        valueFiles:
          - $values/deploy/observability/values/loki-stack.yaml
    - repoURL: "https://github.com/vijaygiduthuri/banking_application_eks.git"
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
