# Tempo: trace store (queried straight from Grafana).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: banking
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: 1.24.4 # pinned; bump deliberately after testing
      helm:
        valueFiles:
          - $values/deploy/observability/values/tempo.yaml
    - repoURL: "https://github.com/vijaygiduthuri/banking_application_eks.git"
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
