# Raw manifests that complete the observability stack:
#   - ServiceMonitor scraping every part-of=banking-platform /metrics
#   - the custom "Banking Platform - Services" Grafana dashboard ConfigMap
# Directory source (plain YAML, not a Helm chart). Depends on the Prometheus
# Operator CRDs from kube-prometheus-stack.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-extras
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: banking
  source:
    repoURL: "https://github.com/vijaygiduthuri/banking_application_eks.git"
    targetRevision: main
    path: deploy/observability/manifests
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
