# Cluster storage: makes gp3 the default StorageClass and un-defaults gp2.
# The EBS CSI driver that backs gp3 is installed by Terraform (managed add-on).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-storage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: banking
  source:
    repoURL: "https://github.com/vijaygiduthuri/banking_application_eks.git"
    targetRevision: main
    path: deploy/cluster/storage
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system # ignored for cluster-scoped StorageClasses; must be an allowed destination
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
