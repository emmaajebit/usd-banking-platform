# The banking platform itself: our umbrella Helm chart. CI bumps image tags in
# values.yaml; Argo CD reconciles them onto the cluster (GitOps deploy).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: banking
  source:
    repoURL: "https://github.com/vijaygiduthuri/banking_application_eks.git"
    targetRevision: main
    path: deploy/helm/banking-platform
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: banking
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # StatefulSet volumeClaimTemplates are immutable; ignore so Postgres/Kafka
    # PVCs don't cause a perpetual OutOfSync.
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
