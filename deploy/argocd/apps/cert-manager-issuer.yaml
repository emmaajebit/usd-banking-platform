# The Let's Encrypt ClusterIssuer. Separate from the cert-manager app so it can
# retry until the cert-manager CRDs exist (a ClusterIssuer needs the CRDs first).
# Argo CD retries automatically, so ordering across the two apps is eventually
# consistent.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-issuer
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: banking
  source:
    repoURL: "https://github.com/vijaygiduthuri/banking_application_eks.git"
    targetRevision: main
    path: deploy/cluster/cert-manager
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
