# cert-manager: obtains + renews Let's Encrypt TLS certs (Phase 7 / doc 07).
# The ClusterIssuer + app TLS toggle are handled in the banking chart / doc 07.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: banking
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.15.3
    helm:
      values: |
        crds:
          enabled: true
        replicaCount: 2
        global:
          leaderElection:
            namespace: cert-manager   # keep leader-election RBAC out of kube-system
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 200m, memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRDs exceed the annotation size limit → server-side apply
