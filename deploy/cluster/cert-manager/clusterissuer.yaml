# Let's Encrypt (production) ClusterIssuer used by the app's Ingress. When
# ingress.tls=true, cert-manager's ingress-shim auto-issues the banking-tls cert
# via the HTTP-01 challenge, solved through Traefik. Requires the cert-manager
# CRDs (installed by the cert-manager Argo app).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: vijaygiduthuri@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
