apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-services-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  banking-services.json: |
    {
      "title": "Banking Platform — Services",
      "uid": "banking-services",
      "schemaVersion": 39,
      "editable": true,
      "time": { "from": "now-30m", "to": "now" },
      "templating": { "list": [] },
      "panels": [
        {
          "type": "timeseries",
          "title": "Request rate (req/s) by service",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum by (service) (rate(http_requests_total[5m]))", "legendFormat": "{{service}}" }
          ]
        },
        {
          "type": "timeseries",
          "title": "p95 latency (s) by service",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket[5m])))", "legendFormat": "{{service}}" }
          ]
        },
        {
          "type": "timeseries",
          "title": "5xx error rate by service",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "expr": "sum by (service) (rate(http_requests_total{status=~\"5..\"}[5m]))", "legendFormat": "{{service}}" }
          ]
        },
        {
          "type": "stat",
          "title": "Total requests (last 5m)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            { "expr": "sum(increase(http_requests_total[5m]))", "legendFormat": "requests" }
          ]
        }
      ]
    }
