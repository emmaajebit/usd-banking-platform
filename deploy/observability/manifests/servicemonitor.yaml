# Scrapes /metrics from every banking-platform service. All services expose the
# Prometheus middleware metrics (http_requests_total, http_request_duration, and
# Go runtime metrics) on the http port at /metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: banking-platform-services
  namespace: banking
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: ["banking"]
  selector:
    matchLabels:
      app.kubernetes.io/part-of: banking-platform
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
# Scrape the OTel Collector's Prometheus exporter (OTLP metrics from services).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: ["observability"]
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  endpoints:
    - port: prom-export
      path: /metrics
      interval: 30s
