---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.apiGateway.deploymentname }}
  namespace: {{ .Values.namespace }}
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: banking-platform
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.apiGateway.port }}"
        prometheus.io/path: "/metrics"
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: api-gateway
          image: {{ .Values.apiGateway.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.apiGateway.port }}
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: api-gateway-secret
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: "1"
              memory: 192Mi
          readinessProbe:
            httpGet: { path: /readyz, port: {{ .Values.apiGateway.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.apiGateway.port }} }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.apiGateway.servicename }}
  namespace: {{ .Values.namespace }}
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: banking-platform
spec:
  type: {{ .Values.apiGateway.serviceType }}
  selector:
    app: api-gateway
  ports:
    - name: http
      port: {{ .Values.apiGateway.port }}
      targetPort: {{ .Values.apiGateway.port }}
      {{- if eq .Values.apiGateway.serviceType "NodePort" }}
      nodePort: {{ .Values.apiGateway.nodePort }}
      {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: {{ .Values.namespace }}
  labels:
    app: api-gateway
data:
  SERVICE_NAME: "api-gateway"
  ENVIRONMENT: {{ .Values.env.environment | quote }}
  HTTP_PORT: "{{ .Values.apiGateway.port }}"
  LOG_LEVEL: {{ .Values.env.logLevel | quote }}
  LOG_FORMAT: {{ .Values.env.logFormat | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.apiGateway.corsAllowedOrigins | quote }}
  UPSTREAM_SCHEME: "http"
  UPSTREAM_PORT: "8080"
  OTEL_ENABLED: {{ .Values.otel.enabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_EXPORTER_OTLP_INSECURE: {{ .Values.otel.insecure | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: {{ .Values.namespace }}
  labels:
    app: api-gateway
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  JWT_ISSUER: {{ .Values.secrets.jwtIssuer | quote }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.apiGateway.hpa }}
  namespace: {{ .Values.namespace }}
  labels:
    app: api-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.apiGateway.deploymentname }}
  minReplicas: {{ .Values.apiGateway.minReplicas }}
  maxReplicas: {{ .Values.apiGateway.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
