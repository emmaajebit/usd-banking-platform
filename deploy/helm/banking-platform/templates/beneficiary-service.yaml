---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.beneficiaryService.deploymentname }}
  namespace: {{ .Values.namespace }}
  labels:
    app: beneficiary-service
    app.kubernetes.io/part-of: banking-platform
spec:
  replicas: {{ .Values.beneficiaryService.replicas }}
  selector:
    matchLabels:
      app: beneficiary-service
  template:
    metadata:
      labels:
        app: beneficiary-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.beneficiaryService.port }}"
        prometheus.io/path: "/metrics"
    spec:
      # Disable legacy service env vars (e.g. POSTGRES_PORT=tcp://ip:5432) that
      # would collide with our typed config env vars.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: beneficiary-service
          image: {{ .Values.beneficiaryService.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.beneficiaryService.port }}
          envFrom:
            - configMapRef:
                name: beneficiary-service-config
            - secretRef:
                name: beneficiary-service-secret
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: "1"
              memory: 192Mi
          readinessProbe:
            httpGet: { path: /readyz, port: {{ .Values.beneficiaryService.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.beneficiaryService.port }} }
            initialDelaySeconds: 10
            periodSeconds: 15
          startupProbe:
            httpGet: { path: /startupz, port: {{ .Values.beneficiaryService.port }} }
            failureThreshold: 40
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.beneficiaryService.servicename }}
  namespace: {{ .Values.namespace }}
  labels:
    app: beneficiary-service
    app.kubernetes.io/part-of: banking-platform
spec:
  type: ClusterIP
  selector:
    app: beneficiary-service
  ports:
    - name: http
      port: {{ .Values.beneficiaryService.port }}
      targetPort: {{ .Values.beneficiaryService.port }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: beneficiary-service-config
  namespace: {{ .Values.namespace }}
  labels:
    app: beneficiary-service
data:
  SERVICE_NAME: "beneficiary-service"
  ENVIRONMENT: {{ .Values.env.environment | quote }}
  HTTP_PORT: "{{ .Values.beneficiaryService.port }}"
  LOG_LEVEL: {{ .Values.env.logLevel | quote }}
  LOG_FORMAT: {{ .Values.env.logFormat | quote }}
  POSTGRES_ENABLED: "true"
  POSTGRES_HOST: {{ .Values.db.host | quote }}
  POSTGRES_PORT: {{ .Values.db.port | quote }}
  POSTGRES_DB: {{ .Values.db.name | quote }}
  POSTGRES_SSLMODE: {{ .Values.db.sslmode | quote }}
  REDIS_ENABLED: "true"
  REDIS_ADDR: "{{ .Values.redis.servicename }}:{{ .Values.redis.port }}"
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
  OTEL_ENABLED: {{ .Values.otel.enabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_EXPORTER_OTLP_INSECURE: {{ .Values.otel.insecure | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: beneficiary-service-secret
  namespace: {{ .Values.namespace }}
  labels:
    app: beneficiary-service
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.dbUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  JWT_ISSUER: {{ .Values.secrets.jwtIssuer | quote }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.beneficiaryService.hpa }}
  namespace: {{ .Values.namespace }}
  labels:
    app: beneficiary-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.beneficiaryService.deploymentname }}
  minReplicas: {{ .Values.beneficiaryService.minReplicas }}
  maxReplicas: {{ .Values.beneficiaryService.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
